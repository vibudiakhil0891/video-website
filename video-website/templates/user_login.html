<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - EditPro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>

<div class="login-container">
    <h1>🎬 User Login</h1>
    <p class="subtitle">Enter your credentials</p>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('user_login') }}" autocomplete="on">
        <input type="email" name="username" placeholder="Enter Email" required autocomplete="username">
        <input type="password" name="password" placeholder="Enter Password" required autocomplete="current-password">
        <button type="submit" class="btn">Login</button>
    </form>

    <div class="extra-links">
        <a href="{{ url_for('signup') }}">Don't have an account? Signup</a> | 
        <a href="{{ url_for('home') }}">Back to Home</a>
    </div>
</div>

</body>
</html>
